<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#080812" />
    <meta name="description" content="Sharkd — Home game poker tracker. Log games, track stats, settle debts." />
    <meta property="og:title" content="Sharkd" />
    <meta property="og:description" content="Track your home poker games. Log results, settle debts, climb the ranks." />
    <meta property="og:type" content="website" />
    <title>Sharkd 🦈</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #050510;
        min-height: 100vh;
        font-family: 'Georgia', 'Times New Roman', serif;
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Sharkd.</noscript>
    <div id="root"></div>
    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import * as firebaseAuth from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import * as firebaseFirestore from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      window.firebase_app = { initializeApp };
      window.firebase_auth = firebaseAuth;
      window.firebase_firestore = firebaseFirestore;
    </script>
  </body>
</html>
